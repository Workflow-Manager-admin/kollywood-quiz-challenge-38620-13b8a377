<div class="login-container">
  <div class="login-card">
    <h1>Kollywood Quiz Challenge</h1>
    <p>Login to start your movie quiz journey!</p>
    <form (ngSubmit)="login()" autocomplete="off" >
      <input type="text" placeholder="Enter your username" [(ngModel)]="username" name="username" #uname="ngModel" minlength="2" maxlength="20" required />
      <button type="submit">Login</button>
    </form>
    <div class="error" *ngIf="error">{{ error }}</div>
  </div>
</div>
